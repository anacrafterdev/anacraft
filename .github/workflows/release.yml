name: release

on:
  push:
    tags: ["v*"]
  # Cutting a release by hand: pick the bump and the workflow does the rest —
  # version, captures, commit, tag, then the build and publish below. Leaving
  # `bump` alone is a minor release.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch, minor, major, or an explicit x.y.z"
        type: string
        default: minor

permissions:
  contents: write

jobs:
  # A tagged push already carries its version. A manual run does not, so this
  # job bumps the crate and the site's footer, regenerates the capture and the
  # social image so the badge and the board agree, then commits and tags. The
  # tag is what the jobs below key off, which is why a dispatch does not need a
  # second workflow run to be triggered.
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: capture

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<<"$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *.*.*) IFS=. read -r major minor patch <<<"${{ inputs.bump }}" ;;
            *) echo "::error::bump must be patch, minor, major, or x.y.z"; exit 1 ;;
          esac
          next="$major.$minor.$patch"
          {
            echo "current=$current"
            echo "next=$next"
            echo "tag=v$next"
          } >> "$GITHUB_OUTPUT"

      - name: Bump the crate
        env:
          OLD_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml
          # The lock file carries the crate's own version too; only its entry moves.
          awk -v new="$NEW_VERSION" '
            /^name = "anacraft"$/ { crate = 1 }
            crate && /^version = / { sub(/"[^"]*"/, "\"" new "\""); crate = 0 }
            { print }
          ' Cargo.lock > Cargo.lock.bumped && mv Cargo.lock.bumped Cargo.lock
          # The footer badge, and any version a capture already carries.
          perl -pi -e 's/v\Q$ENV{OLD_VERSION}\E/v$ENV{NEW_VERSION}/g' docs/*.html

      - name: Regenerate the captures
        env:
          FONT_DIR: ${{ runner.temp }}/fonts
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pillow
          curl -fsSL -o "$RUNNER_TEMP/font.zip" \
            https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip
          unzip -q -o "$RUNNER_TEMP/font.zip" -d "$FONT_DIR"
          # The zip keeps its files at the root, but do not assume it.
          font_dir=$(dirname "$(find "$FONT_DIR" -name 'JetBrainsMonoNerdFont-Regular.ttf' | head -1)")
          make capture
          ANACRAFT_FONT_DIR="$font_dir" python3 scripts/render-dash.py

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock docs
          git commit -m "Release $TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: [bump]
    # Skipped on a tag push, which is what `needs.bump.result` reports there.
    if: always() && needs.bump.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl targets need a cross linker; `cross` handles both arches.
      - name: Install cross
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      # The OAuth client is compiled in here, from repository secrets, so it
      # never lives in the source tree.
      - name: Build
        shell: bash
        env:
          ANACRAFT_OAUTH_CLIENT_ID: ${{ secrets.ANACRAFT_OAUTH_CLIENT_ID }}
          ANACRAFT_OAUTH_CLIENT_SECRET: ${{ secrets.ANACRAFT_OAUTH_CLIENT_SECRET }}
          # The subscription lookup. Kept in repository secrets rather than in
          # the source; see supabase/README.md.
          ANACRAFT_SUPABASE_URL: ${{ secrets.ANACRAFT_SUPABASE_URL }}
          ANACRAFT_SUPABASE_KEY: ${{ secrets.ANACRAFT_SUPABASE_KEY }}
          # `craft slack --install`. Both are public by design — PKCE is what
          # removes the need for a secret — but they live beside the others so
          # there is one place a build's baked-in values come from.
          ANACRAFT_SLACK_CLIENT_ID: ${{ secrets.ANACRAFT_SLACK_CLIENT_ID }}
          ANACRAFT_SLACK_REDIRECT: ${{ secrets.ANACRAFT_SLACK_REDIRECT }}
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
        run: |
          staging="anacraft-${TAG}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp README.md LICENSE "$staging/"

          # The command is `craft`; `anacraft` ships alongside as an alias so
          # existing installs keep working. Windows gets a copy rather than a
          # symlink, which needs elevation there.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/craft.exe" "$staging/"
            cp "$staging/craft.exe" "$staging/anacraft.exe"
            7z a "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/craft" "$staging/"
            ln -s craft "$staging/anacraft"
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Release notes are written by GitHub Copilot from the PRs merged since the
  # last tag. The action reads merged PRs, so a release built from commits
  # pushed straight to main falls back to GitHub's generated notes; land work
  # through PRs (or squash merges, which the action also reads) to get prose.
  notes:
    needs: [bump]
    if: always() && needs.bump.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.copilot.outputs.release-notes }}
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      # The previous tag can be unreachable if history was rewritten, so fall
      # back to the root commit rather than sending an empty range.
      - name: Find the previous tag
        id: prev
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then prev=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          echo "base=$prev" >> "$GITHUB_OUTPUT"
          echo "range: $prev..$TAG"

      # No token means no Copilot; the release still ships with generated notes.
      - name: Write release notes
        id: copilot
        if: env.COPILOT_GITHUB_TOKEN != ''
        continue-on-error: true
        uses: github/copilot-release-notes@v1
        with:
          base-ref: ${{ steps.prev.outputs.base }}
          head-ref: ${{ needs.bump.outputs.tag || github.ref_name }}
          instructions: .github/release-notes-prompt.md

  publish:
    needs: [bump, build, notes]
    runs-on: ubuntu-latest
    # Notes are best-effort: publish whenever the binaries built.
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag || github.ref_name }}
          files: dist/*
          body: ${{ needs.notes.outputs.notes }}
          generate_release_notes: true
