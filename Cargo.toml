[package]
name = "anacraft"
version = "0.30.1"
edition = "2021"
rust-version = "1.74"
description = "A Google Analytics 4 dashboard in your terminal, with a Minecraft texture pack"
license = "Apache-2.0"
repository = "https://github.com/mehfuzh/anacraft"
readme = "README.md"
keywords = ["ga4", "google-analytics", "analytics", "dashboard", "tui"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
# The command is `craft`; the crate, brand and data paths stay anacraft.
name = "craft"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "net", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
open = "5"
dirs = "5"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
