<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API reference — anacraft</title>
  <!-- Rendered from /v1/openapi.json, by this page, on this machine.
       Swagger UI, Redoc and Scalar all do this better and all of them are a
       megabyte of JavaScript fetched from a CDN — which is a page that stops
       working on a plane, and a binary that grew by a megabyte to hold a
       reference for an API with nineteen routes in it. So: no dependency, no
       network, and the product's own palette. -->
  <style>
    :root {
      --ground: #060a09;
      --ink: #09100d;
      --panel: #0d1512;
      --line: rgba(193, 196, 151, .11);
      --line-2: rgba(193, 196, 151, .20);
      --fg: #c1c497;
      --white: #eef1dc;
      --dim: #6c7f73;
      --jade: #2dd5b7;
      --jade-deep: #509475;
      --gold: #ffe16b;
      --coral: #ff5345;
      --on-accent: #09100d;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ground);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding: 48px 24px 96px;
    }

    ::selection { background: var(--jade); color: #04120e; }
    a { color: var(--jade-deep); }
    .wrap { max-width: 820px; margin: 0 auto; }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -.03em;
      color: var(--white);
      margin-bottom: 20px;
    }

    .brand svg { width: 14px; height: 14px; display: block; margin-right: 2px; color: var(--jade); }

    h1 {
      font-weight: 800;
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: -.035em;
      line-height: 1.05;
      color: var(--white);
    }

    .lede { margin-top: 12px; max-width: 62ch; color: var(--dim); font-size: 15px; }

    .base {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      background: var(--ink);
      border: 1px solid var(--line-2);
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--white);
    }

    .base .k {
      color: var(--dim);
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .group {
      margin-top: 44px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--jade-deep);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .op {
      border-bottom: 1px solid var(--line);
      padding: 16px 2px;
    }

    .sig {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .verb {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--line-2);
      color: var(--jade);
      min-width: 62px;
      text-align: center;
    }

    /* A write is worth reading twice before running, so it is not the same
       colour as a read. */
    .verb.post, .verb.put { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 34%, transparent); }
    .verb.delete { color: var(--coral); border-color: color-mix(in srgb, var(--coral) 34%, transparent); }

    .path { font-family: var(--mono); font-size: 14px; color: var(--white); overflow-wrap: anywhere; }
    .path b { color: var(--jade); font-weight: 400; }
    .needs { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
    .needs.open { color: var(--jade-deep); }
    .why { margin-top: 8px; font-size: 14.5px; color: var(--dim); max-width: 62ch; }

    .try {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 12px;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 11px 13px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg);
      overflow-x: auto;
      white-space: pre;
      transition: border-color .12s;
    }

    .try:hover { border-color: var(--jade); }
    .try.done { border-color: var(--jade); color: var(--jade); }

    footer {
      margin-top: 44px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
    }

    .miss { margin-top: 32px; font-family: var(--mono); font-size: 13px; color: var(--coral); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">
      <svg class="pick" role="img" aria-label="A" width="14" height="14" viewBox="1 1 14 14"
        shape-rendering="crispEdges" fill="currentColor">
        <rect x="6" y="1" width="4" height="1" />
        <rect x="5" y="2" width="6" height="1" />
        <rect x="4" y="3" width="8" height="1" />
        <rect x="4" y="4" width="8" height="1" />
        <rect x="3" y="5" width="4" height="1" />
        <rect x="9" y="5" width="4" height="1" />
        <rect x="3" y="6" width="4" height="1" />
        <rect x="9" y="6" width="4" height="1" />
        <rect x="2" y="7" width="4" height="1" />
        <rect x="10" y="7" width="4" height="1" />
        <rect x="2" y="8" width="4" height="1" />
        <rect x="10" y="8" width="4" height="1" />
        <rect x="1" y="9" width="4" height="1" />
        <rect x="11" y="9" width="4" height="1" />
        <rect x="1" y="10" width="14" height="1" />
        <rect x="1" y="11" width="14" height="1" />
        <rect x="1" y="12" width="4" height="1" />
        <rect x="11" y="12" width="4" height="1" />
        <rect x="1" y="13" width="4" height="1" />
        <rect x="11" y="13" width="4" height="1" />
        <rect x="1" y="14" width="4" height="1" />
        <rect x="11" y="14" width="4" height="1" />
      </svg>nacraft
    </div>

    <h1>API reference</h1>
    <p class="lede" id="lede">Reading the description…</p>
    <div class="base"><span class="k">base</span><span id="base"></span></div>

    <div id="ops"></div>

    <footer>
      the same thing as JSON: <a href="/v1/openapi.json">/v1/openapi.json</a> ·
      the guide: <a href="https://anacraft.dev/serve.html">anacraft.dev/serve.html</a>
    </footer>
  </div>

  <script>
    /* The reference, drawn from the document the server generates.
     *
     * Nothing here knows the routes: it reads /v1/openapi.json, which is built
     * from a table the test suite checks against the router. So this page
     * cannot fall behind the API — there is no second list to forget.
     */
    (function () {
      // The same token the tag page is opened with, if it was passed along.
      // Only used to fill in the curl lines, so they can be run as printed.
      var token = (location.hash.match(/(?:^|[#&])k=([^&]+)/) || [])[1] || '';
      if (token) { history.replaceState(null, '', location.pathname); }

      var $ = function (id) { return document.getElementById(id); };
      var ORDER = ['get', 'post', 'put', 'delete', 'patch'];

      /* Routes come out of the document in path order, which puts `/v1/audit`
       * first and `/v1/tag` last — alphabetical, and no help to a reader. So
       * they are grouped by what they are for, in the order somebody meets
       * them: who are you, what do you pay, what are your properties, what do
       * the numbers say. */
      var GROUPS = [
        { title: 'the machine', match: function (p) { return p === '/v1/health' || p.indexOf('openapi') > -1; } },
        { title: 'signing in', match: function (p) { return p.indexOf('/v1/session') === 0; } },
        { title: 'the subscription', match: function (p) { return p.indexOf('/v1/subscription') === 0; } },
        { title: 'properties and the tag', match: function (p) { return p.indexOf('/v1/propert') === 0 || p.indexOf('/v1/tag') === 0; } },
        { title: 'the palette', match: function (p) { return p.indexOf('/v1/themes') === 0; } },
        { title: 'the numbers', match: function () { return true; } }
      ];

      fetch('/v1/openapi.json')
        .then(function (res) { return res.json(); })
        .then(draw)
        .catch(function () {
          var miss = document.createElement('div');
          miss.className = 'miss';
          miss.textContent = 'could not read /v1/openapi.json — is craft serve still running?';
          $('ops').appendChild(miss);
        });

      function draw(doc) {
        // The heading already says what this is, so the line under it says
        // only what the heading cannot: which version is answering, and what
        // the API is for.
        var info = doc.info || {};
        $('lede').textContent = (info.version ? 'v' + info.version + ' · ' : '')
          + (info.description || '');
        var base = (doc.servers && doc.servers[0] && doc.servers[0].url) || location.origin;
        $('base').textContent = base;

        // Flatten the document into one list of operations, then bucket it.
        var ops = [];
        Object.keys(doc.paths || {}).forEach(function (path) {
          var methods = doc.paths[path];
          Object.keys(methods).forEach(function (verb) {
            ops.push({ path: path, verb: verb, op: methods[verb] });
          });
        });

        var host = $('ops');
        GROUPS.forEach(function (group, i) {
          var mine = ops.filter(function (o) {
            // Each operation lands in the first group that claims it, so the
            // catch-all at the end really is only what nothing else wanted.
            for (var g = 0; g < i; g++) { if (GROUPS[g].match(o.path)) { return false; } }
            return group.match(o.path);
          });
          if (!mine.length) { return; }

          mine.sort(function (a, b) {
            if (a.path !== b.path) { return a.path < b.path ? -1 : 1; }
            return ORDER.indexOf(a.verb) - ORDER.indexOf(b.verb);
          });

          var head = document.createElement('div');
          head.className = 'group';
          head.textContent = group.title;
          host.appendChild(head);
          mine.forEach(function (o) { host.appendChild(operation(o, base)); });
        });
      }

      function operation(entry, base) {
        var op = entry.op;
        var wrap = document.createElement('div');
        wrap.className = 'op';

        var sig = document.createElement('div');
        sig.className = 'sig';

        var verb = document.createElement('span');
        verb.className = 'verb ' + entry.verb;
        verb.textContent = entry.verb;
        sig.appendChild(verb);

        // `{id}` painted apart from the rest, so the shape of a path reads at
        // a glance. Built from text nodes: a path is the document's, and the
        // document is generated, but nothing here is worth an innerHTML for.
        var path = document.createElement('span');
        path.className = 'path';
        entry.path.split(/(\{[^}]+\})/).forEach(function (bit) {
          if (!bit) { return; }
          var node = bit.charAt(0) === '{' ? document.createElement('b') : document.createTextNode(bit);
          if (bit.charAt(0) === '{') { node.textContent = bit; }
          path.appendChild(node);
        });
        sig.appendChild(path);

        var needs = document.createElement('span');
        var open = /Needs: nothing/.test(op.description || '');
        needs.className = 'needs' + (open ? ' open' : '');
        needs.textContent = (op.description || '').replace('Needs: ', '').replace(/\.$/, '');
        sig.appendChild(needs);
        wrap.appendChild(sig);

        if (op.summary) {
          var why = document.createElement('div');
          why.className = 'why';
          why.textContent = op.summary;
          wrap.appendChild(why);
        }

        wrap.appendChild(curl(entry, base, open));
        return wrap;
      }

      /* A line that can be pasted into a terminal and will actually run —
       * with the token in it when this page was given one, and with the path
       * parameters left as they are so it is obvious what has to be filled
       * in. Clicking copies it. */
      function curl(entry, base, open) {
        var parts = ['curl -s'];
        if (entry.verb !== 'get') { parts.push('-X ' + entry.verb.toUpperCase()); }
        parts.push("'" + base + entry.path + "'");
        if (!open) {
          parts.push("\\\n  -H 'Authorization: Bearer " + (token || '<token>') + "'");
        }
        if (entry.verb === 'post' || entry.verb === 'put') {
          parts.push("\\\n  -H 'Content-Type: application/json' -d '{}'");
        }
        var line = parts.join(' ');

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'try';
        button.title = 'Copy';
        button.textContent = line;
        button.addEventListener('click', function () {
          navigator.clipboard.writeText(line).then(function () {
            button.classList.add('done');
            setTimeout(function () { button.classList.remove('done'); }, 1200);
          }).catch(function () { });
        });
        return button;
      }
    })();
  </script>
</body>

</html>
