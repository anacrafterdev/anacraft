# Written out by entrypoint.sh with __PUBLIC_ORIGIN__ and __PORT__ filled in.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # `craft serve` refuses any Origin but its own loopback one. The public
    # origin is the one page it serves once it is behind the load balancer,
    # so that and only that is presented as loopback; every other origin is
    # passed through unchanged and craft turns it away itself.
    map $http_origin $craft_origin {
        default                "$http_origin";
        "__PUBLIC_ORIGIN__"    "http://127.0.0.1:__PORT__";
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://127.0.0.1:__PORT__;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:__PORT__;
            proxy_set_header Origin $craft_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Any absolute redirect craft builds from its own origin comes
            # back out as the public one.
            proxy_redirect http://127.0.0.1:__PORT__/ /;
            proxy_read_timeout 300s;
        }
    }
}
