# Filled from helm/app/values.secrets.prod.yaml, which deploy/sync-secrets.sh
# writes from Secret Manager and .gitignore keeps out of the repo.
apiVersion: v1
kind: Secret
metadata:
  name: anacraft-app-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
