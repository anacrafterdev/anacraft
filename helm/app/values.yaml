namespace: prod
# One replica: each visitor's session lives in this pod's memory, so a second
# replica would not know who a request is from. More needs the sessions moved
# out of process first (see src/serve/hosted.rs).
replicaCount: 1
image: gcr.io/smartloop-gcp-us-east/anacraft-app:latest

host: "app.anacraft.dev"
staticIpName: "anacraft-app-ip"
managedCertificateName: "anacraft-managed-cert-app"

# Real sign-in, each visitor with their own Google account. true serves the
# synthetic demo to everybody instead, with no sign-in.
demo: false
