{% extends "layout.html" %}
{% block title %}anacraft — {{ heading }}{% endblock %}
{% block pane %}
<h2>{{ heading }}</h2>
<p>{{ body }}</p>
<form method="post" action="{{ action }}">
  <label for="url">Your site's URL</label>
  <input id="url" name="url" type="url" inputmode="url" autofocus required
    placeholder="https://myapp.lovable.app" value="{{ url }}">
  <div class="acts">
    <button class="primary" type="submit" style="margin-top:0">{{ submit }}</button>
    <a class="lnk" href="/properties">back to the list</a>
  </div>
</form>
<p class="fine">
  Reused if this site already has a property — the same check
  <code>craft configure</code> makes before it creates anything.
</p>
{% endblock %}
